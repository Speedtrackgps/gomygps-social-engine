name: Daily Social Media Publisher

on:
  schedule:
    # Runs at 10:00 AM IST (which is 04:30 AM UTC) every day
    - cron: '30 4 * * *' 
  workflow_dispatch: # This adds a manual "Run Workflow" button in GitHub for testing!

jobs:
  run-publisher:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Requirements
        run: pip install -r requirements.txt

      - name: Execute Publishing Engine
        env:
          # This pulls the JSON out of the vault and injects it into the server environment
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: python main.py
