name: Daily Social Media Publisher

on:
  repository_dispatch:
    types: [run-daily-posts]
  workflow_dispatch: # Keeps the manual run button just in case

jobs:
  publish:
    runs-on: ubuntu-latest
    # ... the rest of your steps remain exactly the same

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Publisher Script
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          LI_ACCESS_TOKEN: ${{ secrets.LI_ACCESS_TOKEN }}
          LI_PERSON_ID: ${{ secrets.LI_PERSON_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          PIN_ACCESS_TOKEN: ${{ secrets.PIN_ACCESS_TOKEN }}
          PIN_BOARD_ID: ${{ secrets.PIN_BOARD_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python main.py
